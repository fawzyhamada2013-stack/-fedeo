<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد فيديوهات الذكاء الاصطناعي الاحترافي</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 850px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
        }
        h1 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 5px;
            font-size: 28px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #38bdf8;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 2px solid #334155;
            background: #020617;
            color: white;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        .btn-generate {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
        }
        .btn-generate:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .screen-preview {
            margin-top: 25px;
            display: none;
            text-align: center;
        }
        
.video-player-box {
    width: 100%;
    height: 420px;
    background: #000000;
    border-radius: 12px;
    border: 2px solid #334155;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* محاكاة مشهد فيديو بالذكاء الاصطناعي مع حركة واقعية وعناصر حية */
.ai-video-canvas {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(45deg, #0f172a, #1e1b4b, #020617);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* عناصر متحركة داخل "الفيديو" بناءً على طلب المستخدم */
.moving-element {
    font-size: 55px;
    margin-bottom: 15px;
    animation: aiMotion 3s infinite ease-in-out alternate;
}

@keyframes aiMotion {
    0% { transform: scale(1) translateX(-30px) rotate(-5deg); }
    100% { transform: scale(1.1) translateX(30px) rotate(5deg); }
}

.ai-video-overlay-text {
    font-size: 20px;
    font-weight: bold;
    color: #ffffff;
    background: rgba(0, 0, 0, 0.6);
    padding: 10px 20px;
    border-radius: 8px;
    border-right: 4px solid #38bdf8;
    max-width: 85%;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}

.watermark {
    position: absolute;
    bottom: 10px;
    left: 15px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
}

        .progress-box {
            margin-top: 20px;
            display: none;
        }
        .progress-bar-bg {
            width: 100%;
            background: #334155;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #38bdf8;
            transition: width 0.05s linear;
        }
        .status-msg {
            margin-top: 10px;
            color: #38bdf8;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-download {
            background: #10b981;
            color: white;
            text-decoration: none;
            display: inline-block;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .btn-download:hover {
            background: #059669;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>مولد الفيديوهات بالذكاء الاصطناعي</h1>
        <p class="subtitle">أنشئ فيديوهات سينمائية متحركة بالكامل بناءً على وصفك النصي حصرياً</p>

        <div class="control-group">
            <label for="promptInput">1. اكتب فكرة الفيديو ومشهد الحركة (Prompt):</label>
            <input type="text" id="promptInput" placeholder="مثال: أشخاص يتحركون في شوارع مدينة مستقبلية ضخمة...">
        </div>

        <div class="control-group">
            <label for="styleInput">2. اكتب نمط أو ستايل الفيديو (Style Prompt):</label>
            <input type="text" id="styleInput" placeholder="مثال: واقعي جداً، سينمائي، إضاءة ليلية نيون (Cinematic, Photorealistic)...">
        </div>

        <button class="btn-generate" onclick="startAiGeneration()">توليد الفيديو بالذكاء الاصطناعي 🎬</button>

        <!-- شريط معالجة الذكاء الاصطناعي -->
        <div class="progress-box" id="progressBox">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="status-msg" id="statusMsg">جاري الاتصال بنماذج الذكاء الاصطناعي...</div>
        </div>

        <!-- معاينة الفيديو الاحترافي -->
        <div class="screen-preview" id="screenPreview">
            <h3 style="color: #38bdf8; margin-bottom: 10px;">تم تصنيع وتوليد الفيديو الحركي بنجاح! ✨</h3>
            <div class="video-player-box">
                <div class="ai-video-canvas" id="aiVideoCanvas">
                    <div class="moving-element" id="movingElement">🏃‍♂️🚶‍♀️</div>
                    <div class="ai-video-overlay-text" id="videoPromptDisplay">وصف الفيديو هنا</div>
                    <div class="watermark">AI Video Generator Studio</div>
                </div>
            </div>
            <a href="javascript:void(0);" class="btn-download" onclick="alert('تم تجهيز ملف الفيديو بصيغة MP4 وبدء التحميل بنجاح!')">تحميل الفيديو النهائي (MP4) 📥</a>
        </div>
    </div>

<script>
    function startAiGeneration() {
        const prompt = document.getElementById("promptInput").value.trim();
        const style = document.getElementById("styleInput").value.trim();

        if (prompt === "" || style === "") {
            alert("يرجى كتابة وصف الفيديو ونمط الـ Style معاً أولاً!");
            return;
        }

        document.getElementById("screenPreview").style.display = "none";
        const progressBox = document.getElementById("progressBox");
        const progressFill = document.getElementById("progressFill");
        const statusMsg = document.getElementById("statusMsg");

        progressBox.style.display = "block";
        progressFill.style.width = "0%";

        let progress = 0;
        let aiSteps = [
            "تحليل نص الحركة والمشهد بدقة...",
            "توليد الإطارات الديناميكية وتطبيق النمط المطلوب...",
            "معالجة الفيزياء والحركة الحية للعناصر...",
            "تركيب الطبقات وإخراج الفيديو بجودة عالية..."
        ];

        let processTimer = setInterval(() => {
            progress += 2;
            progressFill.style.width = progress + "%";

            if (progress <= 25) {
                statusMsg.innerText = aiSteps[0];
            } else if (progress <= 50) {
                statusMsg.innerText = aiSteps[1];
            } else if (progress <= 75) {
                statusMsg.innerText = aiSteps[2];
            } else {
                statusMsg.innerText = aiSteps[3];
            }

            if (progress >= 100) {
                clearInterval(processTimer);
                progressBox.style.display = "none";
                renderVideoScene(prompt, style);
            }
        }, 45);
    }

    function renderVideoScene(userPrompt, userStyle) {
        const videoPromptDisplay = document.getElementById("videoPromptDisplay");
        const movingElement = document.getElementById("movingElement");

        // تخصيص الأيقونة الحركية بناءً على الكلمات المفتاحية المدخلة من المستخدم
        let combinedText = (userPrompt + " " + userStyle).toLowerCase();
        if (combinedText.includes('سيارة') || combinedText.includes('سواقة') || combinedText.includes('مركبة')) {
            movingElement.innerText = "🏎️💨";
        } else if (combinedText.includes('طائرة') || combinedText.includes('فضاء') || combinedText.includes('صواريخ')) {
            movingElement.innerText = "🚀🌌";
        } else if (combinedText.includes('طبيعة') || combinedText.includes('حيوانات') || combinedText.includes('غابة')) {
            movingElement.innerText = "🐅🌿";
        } else {
            movingElement.innerText = "🚶‍♂️🎬🏃‍♀️"; // حركة أشخاص افتراضية ديناميكية
        }

        videoPromptDisplay.innerText = userPrompt + " (" + userStyle + ")";
        document.getElementById("screenPreview").style.display = "block";
    }
</script>

</body>
</html>
